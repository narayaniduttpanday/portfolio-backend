name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 5 minutes automatically
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive HTTP request
        run: |
          curl --max-time 60 --retry 2 -s -o /dev/null -w "HTTP Status Code: %{http_code}\n" https://portfolio-backend-o7tw.onrender.com/api/skills
