spring.application.name=portfolio
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portfolio_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:changeme}

# Tables are created by db/schema.sql, so Hibernate only reads/writes
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
